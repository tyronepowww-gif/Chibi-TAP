<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Chibi TAP</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#2b2d42;font:14px/1.35 ui-monospace,Menlo,Consolas,monospace;color:#0f380f;display:flex;justify-content:center;min-height:100vh;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
#dev{width:100%;max-width:420px;background:#d8d4c0;padding:12px;border-radius:18px 18px 48px 18px;margin:8px;align-self:flex-start}
#top{display:flex;justify-content:space-between;font-weight:700;font-size:12px;margin-bottom:6px}
#scr{background:#9bbc0f;border:3px solid #0f380f;border-radius:8px 8px 28px 8px;padding:10px;min-height:440px;overflow:auto}
body.mono #scr{background:#e8e8e8}
button{font:inherit;background:#8bac0f;color:#0f380f;border:2px solid #0f380f;border-radius:6px;padding:9px;margin:3px 0;width:100%;touch-action:manipulation;user-select:none}
body.mono button{background:#ddd}
button:active,.on{background:#0f380f!important;color:#9bbc0f!important}
.row{display:flex;gap:6px}.row button{flex:1;width:auto}
pre{white-space:pre-wrap;margin:6px 0;font:inherit}h3{margin:0 0 6px}p{margin:4px 0}
input{font:inherit;width:100%;padding:8px;border:2px solid #0f380f;background:#c4d98a;margin:3px 0}
.meter{position:relative;height:200px;width:60px;margin:8px auto;border:2px solid #0f380f}.meter b{position:absolute;bottom:0;left:0;right:0;background:#0f380f;height:0}.zone{position:absolute;left:0;right:0;background:rgba(255,255,255,.6)}
.sig{font-size:44px;text-align:center;height:80px;line-height:80px}
.pad,.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}.pad button{font-size:22px}.grid button{height:60px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.g4 button{height:70px;font-size:24px}

</style></head><body><div id="dev"><div id="top"><span>CHIBI TAP v1.1</span><span id="msg"></span><button onclick="home()" style="width:auto;margin:0;padding:1px 8px">⌂</button></div><div id="scr"></div></div>
<input type="file" id="cf" accept=".js" hidden><input type="file" id="pf" accept=".json" hidden><input type="file" id="df" accept=".json" hidden><input type="file" id="af" accept="audio/*" hidden><input type="file" id="imf" accept="image/*" hidden><input type="file" id="rf" accept=".js,.jsx,.ts,.tsx,.html,.css,.json,.py,.md,.txt" hidden>
<script>
const $=s=>document.querySelector(s),R=$('#scr'),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const K='chibitap.v1',blank=()=>({profile:{name:'',created:Date.now()},settings:{music:true,sound:true,vibration:false,theme:'chibi',text:14,loop:false},cartridges:{},training:{},media:{},history:[],kv:{}});
let D;try{D=Object.assign(blank(),JSON.parse(localStorage[K]))}catch(e){D=blank()}
const save=()=>{try{localStorage[K]=JSON.stringify(D)}catch(e){msg('STORAGE FULL')}};
const beep=()=>{try{const c=beep.c=beep.c||new AudioContext(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);g.gain.value=.05;o.frequency.value=660;o.start();o.stop(c.currentTime+.06)}catch(e){}};
const msg=m=>{$('#msg').textContent=m;clearTimeout(msg.t);msg.t=setTimeout(()=>$('#msg').textContent='',1800);if(D.settings.sound)beep();if(D.settings.vibration&&navigator.vibrate)navigator.vibrate(15)};
const dl=(n,t)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t]));a.download=n;a.click()};
const bar=v=>'█'.repeat(Math.round(v/10))+'░'.repeat(10-Math.round(v/10));
const band=s=>s<40?'BEGINNER':s<65?'TRAINED':s<82?'ADVANCED':'ELITE';
/* ---- media layer: IndexedDB, behind a tiny API ---- */
const mdb=()=>new Promise((ok,no)=>{const q=indexedDB.open('chibitap-media',1);q.onupgradeneeded=()=>q.result.createObjectStore('audio',{keyPath:'id'});q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)});
const mtx=(m,f)=>mdb().then(db=>new Promise((ok,no)=>{const t=db.transaction('audio',m),q=f(t.objectStore('audio'));t.oncomplete=()=>ok(q.result);t.onerror=()=>no(t.error)}));
const mediaAPI={add:(blob,name)=>{const id='T'+Date.now();return mtx('readwrite',st=>st.put({id,name:name||'track',type:blob.type,blob,created:Date.now()})).then(()=>id)},
list:()=>mtx('readonly',st=>st.getAll()).then(a=>a.map(x=>({id:x.id,name:x.name,type:x.type,created:x.created}))),
get:id=>mtx('readonly',st=>st.get(id)).then(x=>x&&x.blob),remove:id=>mtx('readwrite',st=>st.delete(id))};
(async()=>{const o=D.media||{},ids=Object.keys(o);if(!ids.length)return;try{for(const i of ids)await mediaAPI.add(await(await fetch(o[i].data)).blob(),o[i].name);D.media={};save()}catch(e){}})();
/* ---- bus / modal / compat ---- */
const H={},INP=[],MOD={},API=['media','onLaunch','storage','ui','message','input','modal','scouter','emit','on'];
const bus={on:(e,f)=>(H[e]=H[e]||[]).push(f),emit:(e,d)=>(H[e]||[]).forEach(f=>{try{f(d)}catch(x){console.error(x)}})};
const modal={register:(t,f)=>MOD[t]=f,get:t=>MOD[t],list:()=>Object.keys(MOD)};
modal.register('text',v=>({type:'text',value:String(v)}));modal.register('touch',a=>({type:'touch',action:a}));
modal.register('image',d=>({type:'image',source:'local',data:d}));modal.register('audio',d=>({type:'audio',source:'local',data:d}));
bus.on('INPUT',x=>{const f=MOD[x.type];if(f){INP.push(f(x.v));if(INP.length>20)INP.shift()}});
const compat={has:n=>API.includes(n)||n==='screen'};
/* ---- scouter ---- */
const ST=['STR','SPD','END','SKL','TRANSFER','CTRL','TAC','ADAPT'];
function report(o){const s=D.training.scouter=D.training.scouter||{};for(const k in o)if(typeof o[k]=='number')s[k]=Math.round(Math.max(0,Math.min(100,o[k])));save()}
/* ---- runtime ---- */
const C={};let TM=[],cur=null,pend=null,PK=null;
const B=(id,meta,fn)=>C[id]={meta,fn};
const clr=()=>{TM.forEach(clearTimeout);TM=[]};
function makeTap(id){const t={L:[],onLaunch:f=>t.L.push(f),
storage:{get:k=>D.kv[id+':'+k],set:(k,v)=>{D.kv[id+':'+k]=v;save()},remove:k=>{delete D.kv[id+':'+k];save()},clear:()=>{for(const k in D.kv)if(k.startsWith(id+':'))delete D.kv[k];save()},keys:()=>Object.keys(D.kv).filter(k=>k.startsWith(id+':')).map(k=>k.slice(id.length+1))},
ui:{screen:x=>{R.innerHTML='<pre>'+esc(x)+'</pre><button onclick="home()">RETURN</button>'},html:h=>{R.innerHTML=h},root:R},
message:msg,media:mediaAPI,emit:bus.emit,on:bus.on,input:{collect:()=>INP.slice()},modal,scouter:{report},compat,
$:s=>R.querySelector(s),stop:x=>{clearTimeout(x);clearInterval(x);TM=TM.filter(y=>y!==x)},exit:()=>home(),
every:(f,ms)=>{const x=setInterval(()=>{if(cur===t)try{f()}catch(e){fail(id,e)}},ms);TM.push(x);return x},after:(f,ms)=>{const x=setTimeout(()=>{if(cur===t)try{f()}catch(e){fail(id,e)}},ms);TM.push(x);return x},
result:(k,s,m,st)=>result(id,k,s,m,st),
util:{avg:a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0,sd:a=>{if(a.length<2)return 0;const m=a.reduce((x,y)=>x+y,0)/a.length;return Math.sqrt(a.reduce((x,y)=>x+(y-m)**2,0)/a.length)},clamp:v=>Math.max(0,Math.min(100,v)),bar}};return t}
function run(id){clr();const t=makeTap(id);cur=t;try{const c=C[id];if(c)c.fn(t);else{let got=null;new Function('TAP_CARTRIDGE','tap',D.cartridges[id].src)((m,f)=>{got=f},t);if(got)got(t)}t.L.forEach(f=>f())}catch(x){fail(id,x)}}
function fail(id,x){clr();const m=(C[id]||D.cartridges[id]||{}).meta||{name:id};R.innerHTML=`<h3>CARTRIDGE ERROR</h3><p>${esc(m.name)}</p><p>The cartridge could not start.</p><details><summary>VIEW DETAILS</summary><pre>${esc(x&&x.stack||x)}</pre></details><button onclick="home()">RETURN</button>`}
function result(id,key,score,m,stat){score=Math.round(Math.max(0,Math.min(100,score)));const T=D.training[key]=D.training[key]||{best:0,sessions:[],lastScore:0};T.sessions.push({t:Date.now(),score,m});T.sessions=T.sessions.slice(-20);T.lastScore=score;T.best=Math.max(T.best,score);D.history.push({t:Date.now(),k:key,s:score});D.history=D.history.slice(-100);if(stat)report({[stat]:score});save();
R.innerHTML=`<h3>${esc(key)} SCORE: ${score}</h3><pre>${Object.entries(m).map(([k,v])=>k+': '+v).join('\n')}\nBAND: ${band(score)}\nBEST: ${T.best}\n${T.sessions.slice(-5).map(s=>s.score).join(' → ')}</pre><small>Game performance only, not a medical or physiological measure.</small><button onclick="run('${id}')">AGAIN</button><button onclick="home()">HOME</button>`}
const srcOf=i=>'TAP_CARTRIDGE('+JSON.stringify(C[i].meta)+', '+C[i].fn.toString()+');';
/* ---- screens ---- */
function home(){clr();cur=null;R.innerHTML=`<h3>CHIBI TAP</h3><button onclick="carts()">CARTRIDGES</button><button onclick="phys()">PHYSICAL</button><button onclick="scout()">SCOUTER-LITE</button><button onclick="port()">PORTABLE</button><button onclick="media()">MEDIA</button><button onclick="rdr()">READER</button><button onclick="data()">DATA</button><button onclick="sets()">SETTINGS</button><div style="text-align:center;font-size:24px;margin-top:10px">● TAP</div>`}
function carts(){clr();cur=null;const all=[...Object.keys(C).map(i=>[i,C[i].meta,0]),...Object.keys(D.cartridges).map(i=>[i,D.cartridges[i].meta,1])];
R.innerHTML='<h3>CARTRIDGES</h3>'+all.map(([i,m,u])=>`<div class="row"><button onclick="run('${i}')">${esc(m.name)}</button><button style="flex:0 0 52px" onclick="exp('${i}')">EXP</button>${u?`<button style="flex:0 0 52px" onclick="del('${i}')">DEL</button>`:''}</div>`).join('')+`<button onclick="$('#cf').click()">IMPORT CARTRIDGE</button><button onclick="home()">BACK</button>`}
function exp(i){dl((C[i]?C[i].meta.name:D.cartridges[i].meta.name).toLowerCase().replace(/\W+/g,'-')+'.js',C[i]?srcOf(i):D.cartridges[i].src)}
function del(i){if(confirm('Delete this cartridge?')){delete D.cartridges[i];save();carts()}}
$('#cf').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;const src=await f.text();if(!/TAP_CARTRIDGE|onLaunch/.test(src))return msg('NOT A CARTRIDGE');const g=r=>(src.match(r)||[])[1];
const meta={name:g(/name\s*:\s*["'`]([^"'`]+)/)||f.name.replace(/\.js$/,''),description:g(/description\s*:\s*["'`]([^"'`]+)/)||'',version:g(/version\s*:\s*["'`]([^"'`]+)/)||'?'};pend={meta,src};
R.innerHTML=`<h3>CARTRIDGE WARNING</h3><p>This cartridge contains JavaScript. Only install code you trust.</p><pre>${esc(meta.name)}\n${esc(meta.description)}\nv${esc(meta.version)}</pre><button onclick="inst()">INSTALL</button><button onclick="carts()">CANCEL</button>`};
function inst(){const id=pend.meta.name.toLowerCase().replace(/\W+/g,'-')+'-'+(Date.now()%1e5);D.cartridges[id]=pend;save();msg('INSTALLED');carts()}
function phys(){clr();cur=null;const g=k=>(D.training[k]||{}).lastScore||0,tr=k=>(((D.training[k]||{sessions:[]}).sessions.slice(-4).map(s=>s.score).join(' → '))||'—'),pi=Math.round(g('STR')*.34+g('SPD')*.33+g('END')*.33);
R.innerHTML=`<h3>PHYSICAL</h3><button onclick="run('STR')">STR · ${band(g('STR'))}</button><button onclick="run('SPD')">SPD · ${band(g('SPD'))}</button><button onclick="run('END')">END · ${band(g('END'))}</button><pre>PHYSICAL INDEX: ${pi}\nSTABILITY: ${100-(Math.max(g('STR'),g('SPD'),g('END'))-Math.min(g('STR'),g('SPD'),g('END')))}\nFORCE   ${bar(g('STR'))}\nSPEED   ${bar(g('SPD'))}\nSUSTAIN ${bar(g('END'))}\n\nSTR ${tr('STR')}\nSPD ${tr('SPD')}\nEND ${tr('END')}</pre><small>Game index, not a medical or physiological measure.</small><button onclick="home()">BACK</button>`}
let SM=0;const MODES=['RAW','PERF','SUMMARY'];
function scout(){clr();cur=null;const s=D.training.scouter||{},v=ST.filter(k=>k in s),ix=v.length?Math.round(v.reduce((a,k)=>a+s[k],0)/v.length):0;let b;
if(SM==0)b=ST.map(k=>(k+'         ').slice(0,10)+(k in s?s[k]:'--')).join('\n');else if(SM==1)b=ST.map(k=>(k+'         ').slice(0,9)+bar(s[k]||0)+' '+(s[k]||0)).join('\n');
else{const so=v.slice().sort((a,c)=>s[c]-s[a]);b=v.length?'Strongest: '+so[0]+'\nFocus next: '+so[so.length-1]+'\nTraining band: '+band(ix):'Play some cartridges first.'}
R.innerHTML=`<h3>SCOUTER-LITE</h3><div class="row">${MODES.map((m,i)=>`<button onclick="SM=${i};scout()"${i==SM?' class="on"':''}>${m}</button>`).join('')}</div><pre>${b}\n\nEXECUTION INDEX\n${ix}</pre><small>GAME PERFORMANCE. Not real-world power or physiology.</small><button onclick="home()">BACK</button>`}
function port(){R.innerHTML=`<h3>PORTABLE</h3><p>CORE + CARTRIDGES + DATA + CONFIG</p><button onclick="expP()">EXPORT TAP</button><button onclick="$('#pf').click()">IMPORT TAP</button><small>Limitation: audio stays in this browser's IndexedDB and is not in the package yet. ZIP is not built in. The package is one folder-shaped JSON file so ZIP can be added later.</small><button onclick="home()">BACK</button>`}
function expP(){const cs={};for(const i in C)cs[i]={meta:C[i].meta,src:srcOf(i),builtin:1};for(const i in D.cartridges)cs[i]=D.cartridges[i];dl('chibi-tap-portable.json',JSON.stringify({format:'chibi-tap-portable',version:1,manifest:{app:'Chibi TAP',exported:new Date().toISOString()},cartridges:cs,data:Object.assign({},D,{cartridges:{}})},null,1))}
$('#pf').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{const p=JSON.parse(await f.text());if(p.format!=='chibi-tap-portable'||!p.data)throw 0;PK=p;
R.innerHTML=`<h3>IMPORT TAP PACKAGE</h3><pre>Cartridges found: ${Object.keys(p.cartridges||{}).length}\nSaved data found: ${Object.keys(p.data.training||{}).length?'YES':'NO'}\nSettings found: ${p.data.settings?'YES':'NO'}</pre><small>Package cartridges contain JavaScript. Only import packages you trust.</small><button onclick="mergeP(0)">MERGE</button><button onclick="mergeP(1)">REPLACE</button><button onclick="port()">CANCEL</button>`}catch(x){msg('INVALID PACKAGE')}};
function mergeP(rep){const p=PK,add={};for(const i in p.cartridges||{}){const c=p.cartridges[i];if(!c.builtin&&(rep||!D.cartridges[i]))add[i]={meta:c.meta,src:c.src}}
if(rep)D=Object.assign(blank(),p.data,{cartridges:add});else{const d=p.data;for(const k of['training','media','kv'])D[k]=Object.assign({},d[k],D[k]);D.history=D.history.concat(d.history||[]).slice(-100);Object.assign(D.cartridges,add)}save();apply();msg('IMPORTED');home()}
async function media(){clr();cur=null;let ids=[];try{ids=await mediaAPI.list()}catch(e){}
R.innerHTML='<h3>MEDIA</h3>'+(ids.map(x=>`<div class="row"><button onclick="play('${x.id}')">▶ ${esc(x.name)}</button><button style="flex:0 0 44px" onclick="AU.pause()">❚❚</button><button style="flex:0 0 44px" onclick="rmT('${x.id}')">✕</button></div>`).join('')||'<p>No tracks yet.</p>')+`<label><input type="checkbox" style="width:auto" ${D.settings.loop?'checked':''} onchange="D.settings.loop=this.checked;AU.loop=this.checked;save()"> loop</label><button onclick="$('#af').click()">IMPORT AUDIO</button><hr><input id="ti" placeholder="text input"><div class="row"><button onclick="sendT()">SEND TEXT</button><button onclick="$('#imf').click()">IMAGE</button></div><pre>INPUTS: ${INP.map(x=>x.type).join(', ')||'none'}</pre><button onclick="home()">BACK</button>`}
const AU=new Audio();
let AUURL=null;async function play(i){if(!D.settings.music)return msg('MUSIC OFF');try{const b=await mediaAPI.get(i);if(AUURL)URL.revokeObjectURL(AUURL);AUURL=URL.createObjectURL(b);AU.src=AUURL;AU.loop=!!D.settings.loop;await AU.play()}catch(e){msg('CANNOT PLAY')}}
async function rmT(i){if(confirm('Remove this track?')){await mediaAPI.remove(i);media()}}
function sendT(){const v=$('#ti').value.trim();if(v)bus.emit('INPUT',{type:'text',v});media()}
function readF(e,cb){const f=e.target.files[0];e.target.value='';if(!f)return;const r=new FileReader();r.onload=()=>cb(f,r.result);r.readAsDataURL(f)}
$('#af').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{await mediaAPI.add(f,f.name);bus.emit('INPUT',{type:'audio',v:f.name})}catch(x){msg('MEDIA STORE FAILED')}media()};
$('#imf').onchange=e=>readF(e,(f,d)=>{bus.emit('INPUT',{type:'image',v:d});msg('IMAGE ADDED');media()});
function data(){R.innerHTML=`<h3>DATA</h3><pre>${esc(D.history.slice(-8).map(h=>h.k+' '+h.s).join('\n')||'No sessions yet')}</pre><button onclick="expD()">EXPORT DATA</button><button onclick="$('#df').click()">IMPORT DATA</button><button onclick="home()">BACK</button>`}
const expD=()=>dl('chibi-tap-data.json',JSON.stringify({profile:D.profile,settings:D.settings,training:D.training,history:D.history,kv:D.kv},null,1));
$('#df').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{const p=JSON.parse(await f.text());if(!p||typeof p!='object'||typeof p.training!='object')throw 0;if(confirm('Replace local progress with this file?')){Object.assign(D,{profile:p.profile||D.profile,settings:p.settings||D.settings,training:p.training,history:Array.isArray(p.history)?p.history:[],kv:p.kv||{}});save();apply();msg('IMPORTED');data()}}catch(x){msg('INVALID DATA')}};
function sets(){const s=D.settings,t=(k,l)=>`<button onclick="s_('${k}')">${l}: ${s[k]?'ON':'OFF'}</button>`;
R.innerHTML='<h3>SETTINGS</h3>'+t('sound','SOUND')+t('music','MUSIC')+t('vibration','VIBRATION')+`<button onclick="s_('theme')">THEME: ${s.theme}</button><div class="row"><button onclick="s_('-')">A-</button><button onclick="s_('+')">A+</button></div><button onclick="expD()">EXPORT DATA</button><button onclick="$('#df').click()">IMPORT DATA</button><button onclick="dev()">DEV MODE</button><button onclick="if(confirm('Reset TAP? All local data is erased.')){localStorage.removeItem(K);D=blank();apply();home()}">RESET TAP</button><button onclick="home()">BACK</button>`}
function s_(k){const s=D.settings;if(k=='theme')s.theme=s.theme=='chibi'?'mono':'chibi';else if(k=='+'||k=='-')s.text=Math.max(11,Math.min(20,s.text+(k=='+'?1:-1)));else s[k]=!s[k];save();apply();sets()}
function apply(){document.body.style.fontSize=D.settings.text+'px';document.body.className=D.settings.theme=='mono'?'mono':''}
async function dev(){let mc='?';try{mc=(await mediaAPI.list()).length}catch(e){}let ok='OK';try{localStorage.setItem('_t',1);localStorage.removeItem('_t')}catch(e){ok='FAIL'}
R.innerHTML=`<h3>DEV MODE</h3><pre>TAP CORE: OK\nSTORAGE: ${ok}\nCARTRIDGES: ${Object.keys(C).length+Object.keys(D.cartridges).length}\nMEDIA: ${mc} (IndexedDB)\nMODALITIES: ${modal.list().join(' ')}\nAPI: ${API.map(a=>a+' ✓').join(' ')}\nDATA: ${JSON.stringify(D).length/1024|0}KB</pre><button onclick="sets()">BACK</button>`}
/* ---- cartridges (each uses only the tap API so it can be exported) ---- */
B('KORIN',{name:'KORIN',description:'Precision fundamentals (SKL)',version:'1.0',group:'TRAINING'},function(tap){tap.onLaunch(()=>{const U=tap.util,N=10;let i=0,r=[],t0=0,tx,ty;
tap.ui.html('<h3>KORIN · PRECISION</h3><p>Tap the center of each ring.</p><div id="arena"></div>');const A=tap.$('#arena');
function nx(){if(i>=N)return fin();tx=10+Math.random()*80;ty=10+Math.random()*80;A.innerHTML='<i style="left:'+tx+'%;top:'+ty+'%"></i>';t0=performance.now()}
A.onpointerdown=e=>{if(!t0)return;const b=A.getBoundingClientRect(),dx=e.clientX-b.left-tx*b.width/100,dy=e.clientY-b.top-ty*b.height/100;r.push({d:Math.hypot(dx,dy),t:performance.now()-t0});t0=0;i++;A.innerHTML='';tap.emit('INPUT',{type:'touch',v:'PLACE'});tap.after(nx,350)};
function fin(){const p=U.avg(r.map(x=>U.clamp(100-x.d*3))),rt=U.avg(r.map(x=>x.t)),s=U.clamp(100-(rt-400)/12),c=U.clamp(100-U.sd(r.map(x=>x.d))*3);tap.result('KORIN',p*.6+s*.2+c*.2,{Accuracy:Math.round(p)+'%',Reaction:Math.round(rt)+'ms',Consistency:Math.round(c),Status:'FUNDAMENTALS READY'},'SKL')}
nx()})});
B('ROSHI',{name:'MASTER ROSHI',description:'Discipline: hold the beat',version:'1.0',group:'TRAINING'},function(tap){tap.onLaunch(()=>{const U=tap.util,N=24,G=700;let t0=0,hit={},off=[],extra=0;
